name: Build pgAdmin component

on:
  workflow_dispatch:
    inputs:
      pgadmin:
        description: pgAdmin version on PyPI, such as 9.19
        required: true
      build:
        description: Build number for this pgAdmin version, starting at 1
        required: true
        default: "1"
      build_frontend:
        description: Build the interface from pgAdmin's release tag (only when the official wheel lacks it)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  frontend:
    name: Build the interface
    if: inputs.build_frontend
    runs-on: ubuntu-24.04
    env:
      PGADMIN: ${{ inputs.pgadmin }}
    steps:
      - name: Find pgAdmin's release tag
        run: |
          [[ "$PGADMIN" =~ ^([0-9]+)\.([0-9]+)(\.post[0-9]+)?$ ]] || { echo "::error::Invalid pgAdmin version"; exit 1; }
          echo "SOURCE_TAG=REL-${BASH_REMATCH[1]}_${BASH_REMATCH[2]}" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pgadmin-org/pgadmin4
          ref: ${{ env.SOURCE_TAG }}
          path: pgadmin-source
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.5

      - name: Build
        working-directory: pgadmin-source/web
        run: |
          corepack yarn install --immutable
          NODE_ENV=production NODE_OPTIONS=--max-old-space-size=3072 corepack yarn run webpacker

      # The interface is the same on every platform, so each build uses this one.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend
          path: |
            pgadmin-source/web/version.py
            pgadmin-source/web/pgadmin/static/js/generated
          if-no-files-found: error

  build:
    name: Build ${{ matrix.platform }}
    needs: frontend
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-15
            python: python3
          - platform: windows-x64
            runner: windows-2025
            python: python
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      PGADMIN: ${{ inputs.pgadmin }}
      BUILD: ${{ inputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check inputs
        run: |
          [[ "$PGADMIN" =~ ^[0-9]+\.[0-9]+(\.post[0-9]+)?$ ]] || { echo "::error::Invalid pgAdmin version"; exit 1; }
          [[ "$BUILD" =~ ^[1-9][0-9]*$ ]] || { echo "::error::Invalid build number"; exit 1; }

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.build_frontend
        with:
          name: frontend
          path: frontend

      - name: Build and check the component
        env:
          PLATFORM: ${{ matrix.platform }}
          PYTHON: ${{ matrix.python }}
          FRONTEND: ${{ inputs.build_frontend && 'frontend' || '' }}
        run: $PYTHON -I build.py --pgadmin "$PGADMIN" --build "$BUILD" --platform "$PLATFORM" --out dist ${FRONTEND:+--frontend "$FRONTEND"}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: component-${{ matrix.platform }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: ${{ !failure() && !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      PGADMIN: ${{ inputs.pgadmin }}
      BUILD: ${{ inputs.build }}
      FRONTEND_BUILT: ${{ inputs.build_frontend }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="pgadmin-$PGADMIN-$BUILD"
          sha256sum *.zip > SHA256SUMS
          interface="the official pgAdmin wheel"
          [[ "$FRONTEND_BUILT" == "true" ]] && interface="pgAdmin's REL tag source, built here because the official wheel lacks it"
          {
            echo "pgAdmin $PGADMIN packaged for Arcnix, build $BUILD."
            echo
            echo "- pgAdmin: official wheel from PyPI, checked against PyPI's SHA-256"
            echo "- Interface: $interface"
            echo "- Python: python-build-standalone, pinned in pins.json at $GITHUB_SHA"
            echo "- Dependencies: versions pinned in constraints/$PGADMIN.txt at $GITHUB_SHA"
            echo
            echo '```'
            for file in *.zip; do echo "$(sha256sum "$file" | cut -d' ' -f1)  $(stat -c %s "$file")  $file"; done
            echo '```'
          } > notes.md
          gh release create "$tag" *.zip SHA256SUMS --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "pgAdmin $PGADMIN, build $BUILD" --notes-file notes.md
